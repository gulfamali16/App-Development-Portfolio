name: Build Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: false

      - name: Verify Flutter version
        run: flutter --version

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > SmartPOS/android/release-key.jks

      - name: Create key.properties
        run: |
          echo "storeFile=release-key.jks" > SmartPOS/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> SmartPOS/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> SmartPOS/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> SmartPOS/android/key.properties

      - name: Flutter pub get
        working-directory: ./SmartPOS
        run: flutter pub get

      - name: Build AAB
        working-directory: ./SmartPOS
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: SmartPOS/build/app/outputs/bundle/release/app-release.aab
